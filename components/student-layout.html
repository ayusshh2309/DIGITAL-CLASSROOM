      <a
        class="student-profile-button"
        href="st_profile.html"
        aria-label="Open Ayush Kumar profile"
      >

          class="student-avatar"
          src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&amp;auto=format&amp;fit=crop&amp;q=80"
          alt="Ayush Kumar"
        />

          ><strong>Ayush Kumar</strong

            >Grade 12 <span aria-hidden="true">&bull;</span> PCM</small
          ></span
