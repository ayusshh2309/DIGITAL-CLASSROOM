<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Learning DC - Notes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
      :root {
        color-scheme: light;
        --notes-ink: #17233f;
        --notes-muted: #687895;
        --notes-border: #e5eaf3;
        --notes-accent: #5739d6;
        --notes-surface: #ffffff;
        --notes-shadow: 0 12px 32px rgba(30, 48, 86, 0.06);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background:
          radial-gradient(ellipse at 12% 0%, rgba(226, 237, 255, 0.65), transparent 34rem),
          #f5f7fc;
        color: var(--notes-ink);
      }

      .notes-page {
        width: 100%;
        min-height: 100vh;
        max-width: 1600px;
        margin: 0 auto;
        padding: 34px clamp(20px, 3vw, 48px) 48px;
      }

      /* =========================
       PAGE HEADER
    ========================= */

      .page-header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin-bottom: 28px;
        padding: 4px 2px 0;
      }

      .page-title h1 {
        margin-top: 9px;
        font-size: clamp(2rem, 3vw, 2.55rem);
        letter-spacing: -0.055em;
        font-weight: 800;
        color: var(--notes-ink);
      }

      .page-eyebrow {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 2px;
        color: var(--notes-accent);
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .page-eyebrow i {
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border: 1px solid #e6e1ff;
        border-radius: 9px;
        background: #f0edff;
        font-size: 12px;
      }

      .registration-context {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        width: fit-content;
        margin-top: 16px;
        padding: 9px 13px;
        border: 1px solid #dfe7f3;
        border-radius: 11px;
        background: rgba(255, 255, 255, 0.78);
        color: #40516f;
        font-size: 11px;
        box-shadow: 0 4px 12px rgba(30, 48, 86, 0.035);
      }

      .scope-label {
        color: #425372;
        font-weight: 800;
      }

      .scope-value {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--notes-accent);
        font-weight: 700;
      }

      .page-title p {
        max-width: 560px;
        margin-top: 7px;
        font-size: 0.94rem;
        color: var(--notes-muted);
      }

      /* =========================
       TOP STATS
    ========================= */

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        margin-bottom: 22px;
      }

      .stat-card {
        background: var(--notes-surface);
        border: 1px solid rgba(226, 232, 243, 0.9);
        border-radius: 16px;
        padding: 17px 19px;
        display: flex;
        align-items: center;
        gap: 14px;
        box-shadow: 0 6px 20px rgba(30, 48, 86, 0.045);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .stat-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 11px 26px rgba(30, 48, 86, 0.075);
      }

      .stat-icon {
        width: 46px;
        height: 46px;
        border-radius: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        flex-shrink: 0;
      }

      .purple {
        background: #eee8ff;
        color: #5d35df;
      }

      .green {
        background: #e8faf2;
        color: #08a66b;
      }

      .orange {
        background: #fff3df;
        color: #ed8b00;
      }

      .blue {
        background: #e8f2ff;
        color: #2877e8;
      }

      .stat-info h3 {
        color: var(--notes-ink);
        font-size: 24px;
        line-height: 1.1;
        font-weight: 800;
        margin-bottom: 3px;
      }

      .stat-info p {
        color: var(--notes-muted);
        font-size: 11px;
        font-weight: 600;
      }

      /* =========================
       MAIN LAYOUT
    ========================= */

      .content-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 315px;
        gap: 20px;
        align-items: start;
      }

      .notes-container,
      .side-card {
        background: var(--notes-surface);
        border: 1px solid var(--notes-border);
        border-radius: 18px;
        box-shadow: var(--notes-shadow);
      }

      /* =========================
       NOTES HEADER
    ========================= */

      .notes-container {
        overflow: hidden;
      }

      .notes-toolbar {
        padding: 17px 20px;
        border-bottom: 1px solid #edf0f7;
        background: linear-gradient(180deg, #fff, #fcfdff);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
      }

      .notes-toolbar h2 {
        color: var(--notes-ink);
        font-size: 16px;
        letter-spacing: -0.025em;
        font-weight: 800;
        white-space: nowrap;
      }

      .toolbar-right {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
        min-width: 0;
      }

      .toolbar-right select,
      .notes-search {
        height: 40px;
        padding: 0 13px;
        border: 1px solid #e1e7f1;
        background: #fff;
        border-radius: 10px;
        color: #263653;
        font-family: inherit;
        font-size: 12px;
        outline: 0;
        cursor: pointer;
        transition: border-color 0.18s ease, box-shadow 0.18s ease;
      }

      .toolbar-right select:hover,
      .notes-search:hover {
        border-color: #cbd4e4;
      }

      .toolbar-right select:focus-visible,
      .notes-search:focus-visible {
        border-color: #7862df;
        box-shadow: 0 0 0 3px rgba(87, 57, 214, 0.12);
      }

      .notes-search {
        min-width: 190px;
        cursor: text;
      }

      .notes-search::placeholder {
        color: #91a0b9;
      }

      .notes-status {
        padding: 11px 20px;
        color: var(--notes-muted);
        font-size: 12px;
      }

      .notes-status:empty {
        display: none;
      }

      .notes-status[data-state="error"] {
        color: #a33142;
        background: #fff5f5;
      }

      .notes-status button {
        margin-left: 8px;
        border: 0;
        background: transparent;
        color: #5532d8;
        font: inherit;
        font-weight: 800;
        text-decoration: underline;
        cursor: pointer;
      }

      /* =========================
       NOTES GRID
    ========================= */

      .notes-grid {
        padding: 20px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 245px), 1fr));
        gap: 16px;
      }

      .note-card {
        display: flex;
        flex-direction: column;
        min-height: 230px;
        border: 1px solid #e5eaf3;
        border-radius: 16px;
        padding: 17px;
        background: #ffffff;
        box-shadow: 0 4px 14px rgba(30, 48, 86, 0.035);
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        min-width: 0;
      }

      .note-card:hover {
        transform: translateY(-3px);
        border-color: #d7d1f6;
        box-shadow: 0 12px 28px rgba(50, 65, 110, 0.09);
      }

      .note-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 15px;
      }

      .note-icon {
        width: 44px;
        height: 44px;
        border-radius: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 19px;
        flex-shrink: 0;
      }

      .note-menu {
        border: none;
        background: transparent;
        color: #64728f;
        font-size: 18px;
        cursor: pointer;
      }

      .note-title {
        font-size: 14px;
        line-height: 1.4;
        font-weight: 800;
        color: var(--notes-ink);
        margin-bottom: 7px;
        overflow-wrap: anywhere;
      }

      .note-meta {
        font-size: 11px;
        color: var(--notes-muted);
        line-height: 1.65;
        margin-bottom: 15px;
      }

      .note-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-top: auto;
        margin-bottom: 14px;
        min-width: 0;
      }

      .file-type {
        display: inline-block;
        max-width: 75%;
        font-size: 10px;
        font-weight: 700;
        color: #536582;
        background: #f2f5fa;
        padding: 6px 9px;
        border-radius: 7px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .file-size {
        flex-shrink: 0;
        font-size: 10px;
        color: #7c8aa4;
      }

      .note-actions {
        display: flex;
      }

      .note-btn {
        flex: 1;
        height: 37px;
        border: none;
        border-radius: 10px;
        font-family: inherit;
        font-size: 11px;
        font-weight: 800;
        cursor: pointer;
        transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
      }

      .note-btn:focus-visible,
      .subject-filter-button:focus-visible,
      .side-card-header a:focus-visible {
        outline: 3px solid rgba(87, 57, 214, 0.25);
        outline-offset: 2px;
      }

      .view-btn {
        background: #f1efff;
        color: #4d34c7;
      }

      .view-btn:hover {
        background: var(--notes-accent);
        color: #fff;
      }

      .view-btn:active {
        transform: scale(0.99);
      }

      /* =========================
       RIGHT SIDE
    ========================= */

      .right-column {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .side-card {
        padding: 20px;
      }

      .side-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 17px;
      }

      .side-card-header h3 {
        color: var(--notes-ink);
        font-size: 14px;
        letter-spacing: -0.02em;
        font-weight: 800;
      }

      .side-card-header a {
        font-size: 10px;
        color: var(--notes-accent);
        text-decoration: none;
        font-weight: 700;
      }

      /* =========================
       RECENT NOTES
    ========================= */

      .recent-note {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid #edf0f7;
      }

      .recent-note:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }

      .recent-note.subject-filter-button {
        padding: 12px 0;
        border-bottom: 1px solid #edf0f7;
        text-align: left;
        transition: opacity 0.18s ease;
      }

      .recent-note.subject-filter-button:hover {
        opacity: 0.75;
      }

      .recent-note.subject-filter-button:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }

      .recent-icon {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-shrink: 0;
        font-size: 15px;
      }

      .recent-info {
        min-width: 0;
      }

      .recent-info h4 {
        font-size: 11px;
        font-weight: 700;
        margin-bottom: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .recent-title {
        display: block;
        color: #283753;
        font-size: 11px;
        font-weight: 700;
        margin-bottom: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .recent-meta {
        display: block;
        font-size: 10px;
        color: #8290a8;
      }

      .recent-info p {
        font-size: 9px;
        color: #73809a;
      }

      /* =========================
       SUBJECT PROGRESS
    ========================= */

      .subject-progress {
        margin-bottom: 17px;
      }

      .subject-progress:last-child {
        margin-bottom: 0;
      }

      .subject-row {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        margin-bottom: 7px;
      }

      .subject-row span:first-child {
        color: #344361;
        font-weight: 600;
      }

      .subject-row span:last-child {
        color: #1a2540;
        font-weight: 700;
      }

      .progress-track {
        height: 7px;
        background: #edf0f5;
        border-radius: 20px;
        overflow: hidden;
      }

      .progress-bar {
        height: 100%;
        border-radius: 20px;
        background-image: linear-gradient(90deg, #8068ed, #5535d3);
      }

      .subject-filter-button {
        width: 100%;
        border: 0;
        padding: 0;
        background: transparent;
        text-align: left;
        font: inherit;
        cursor: pointer;
      }

      .subject-filter-button:hover .subject-row span:first-child,
      .subject-filter-button:focus-visible .subject-row span:first-child {
        color: var(--notes-accent);
        text-decoration: underline;
      }

      .subject-filter-button .progress-track {
        display: block;
      }

      /* =========================
       EMPTY STATE
    ========================= */

      .empty-state {
        grid-column: 1 / -1;
        padding: 76px 20px;
        text-align: center;
        color: var(--notes-muted);
      }

      .empty-icon {
        font-size: 40px;
        margin-bottom: 12px;
      }

      .empty-state h3 {
        color: var(--notes-ink);
        margin-bottom: 7px;
        font-size: 17px;
      }

      .empty-state p {
        font-size: 11px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* =========================
       LOADING
    ========================= */

      .loading {
        grid-column: 1 / -1;
        padding: 60px;
        text-align: center;
        color: #66738e;
        font-size: 13px;
      }

      /* =========================
       RESPONSIVE
    ========================= */

      @media (max-width: 1100px) {
        .content-layout {
          grid-template-columns: 1fr;
        }

        .right-column {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 850px) {
        .stats-grid {
          grid-template-columns: repeat(2, 1fr);
        }

        .notes-toolbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .toolbar-right {
          width: 100%;
          justify-content: flex-start;
        }
      }

      @media (max-width: 600px) {
        .notes-page {
          padding: 23px 15px 32px;
        }

        .page-header {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
          margin-bottom: 21px;
        }

        .page-title h1 {
          font-size: 2rem;
        }

        .page-title p {
          max-width: 360px;
          font-size: 0.85rem;
        }

        .registration-context {
          align-items: flex-start;
          flex-direction: column;
          gap: 5px;
        }

        .stats-grid {
          grid-template-columns: 1fr;
          gap: 10px;
        }

        .stat-card {
          padding: 13px 15px;
        }

        .stat-icon {
          width: 40px;
          height: 40px;
          font-size: 19px;
        }

        .notes-grid {
          grid-template-columns: 1fr;
          padding: 14px;
          gap: 12px;
        }

        .notes-toolbar {
          padding: 16px;
        }

        .toolbar-right {
          width: 100%;
          gap: 8px;
        }

        .notes-search {
          flex: 1 1 100%;
          min-width: 0;
        }

        .toolbar-right select {
          flex: 1 1 135px;
          min-width: 0;
          padding: 0 9px;
        }

        .notes-status {
          padding-right: 16px;
          padding-left: 16px;
        }

        .right-column {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <link rel="stylesheet" href="../css/student-layout.css" />
  </head>

  <body>
    <div id="studentLayout"></div>
    <main class="notes-page">
      <!-- =========================
         PAGE TITLE
    ========================== -->

      <section class="page-header">
        <div class="page-title">
          <span class="page-eyebrow">
            <i class="fa-solid fa-book-open" aria-hidden="true"></i>
            Student workspace
          </span>

          <h1>My Notes</h1>
          <p>Access your subject notes and study materials anytime.</p>

          <div class="registration-context" id="registrationContext" hidden>
            <span class="scope-label">Your registered curriculum</span>
            <span class="scope-value">
              <i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>
              <span id="registrationContextText"></span>
            </span>
          </div>
        </div>
      </section>

      <!-- =========================
         STATISTICS
    ========================== -->

      <section class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon purple">📚</div>
          <div class="stat-info">
            <h3 id="totalNotes">—</h3>
            <p>Total Notes</p>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon orange">📖</div>
          <div class="stat-info">
            <h3 id="subjectsCovered">—</h3>
            <p>Subjects Covered</p>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon blue">⭐</div>
          <div class="stat-info">
            <h3 id="recentNotes">—</h3>
            <p>Added This Week</p>
          </div>
        </div>
      </section>

      <!-- =========================
         MAIN CONTENT
    ========================== -->

      <section class="content-layout">
        <!-- NOTES -->

        <div class="notes-container">
          <div class="notes-toolbar">
            <h2>My Notes</h2>

            <div class="toolbar-right">
              <input
                id="notesSearch"
                class="notes-search"
                type="search"
                placeholder="Search notes"
                aria-label="Search notes"
              />

              <select id="subjectFilter">
                <option value="all">All Subjects</option>
              </select>

              <select id="typeFilter" aria-label="Filter by material type">
                <option value="all">All Materials</option>
                <option value="pdf">PDFs</option>
                <option value="image">Photos</option>
                <option value="document">Documents</option>
              </select>

              <select id="sortFilter">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="name">Name A-Z</option>
                <option value="za">Name Z-A</option>
              </select>
            </div>
          </div>

          <div id="notesStatus" class="notes-status" role="status" aria-live="polite"></div>

          <div class="notes-grid" id="notesGrid">
            <div class="loading">Loading notes...</div>
          </div>
        </div>

        <!-- RIGHT COLUMN -->

        <div class="right-column">
          <!-- RECENT NOTES -->

          <div class="side-card">
            <div class="side-card-header">
              <h3>Recent Notes</h3>
              <a href="#" id="viewAllRecent">View all</a>
            </div>

            <div id="recentNotesList">
              <div class="loading">Loading...</div>
            </div>
          </div>

          <!-- SUBJECT PROGRESS -->

          <div class="side-card">
            <div class="side-card-header">
              <h3>Notes by Subject</h3>
            </div>

            <div id="subjectProgress">
              <div class="loading">Loading...</div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script>
      /* =====================================================
       SUPABASE CONFIGURATION
    ===================================================== */

      if (false) {
        const SUPABASE_URL = "YOUR_SUPABASE_URL";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

        const supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY,
        );

        /* =====================================================
       GLOBAL DATA
    ===================================================== */

        let allNotes = [];

        /* =====================================================
       GET CURRENT STUDENT
    ===================================================== */

        async function getCurrentStudent() {
          const {
            data: { user },
            error,
          } = await supabaseClient.auth.getUser();

          if (error || !user) {
            console.log("Student not logged in");
            return null;
          }

          return user;
        }

        /* =====================================================
       LOAD NOTES
    ===================================================== */

        async function loadNotes() {
          const user = await getCurrentStudent();

          if (!user) {
            showError("Please login to view your notes.");
            return;
          }

          /*
        Expected Supabase table:

        notes

        id
        student_id
        subject
        title
        chapter
        file_url
        file_type
        file_size
        created_at
      */

          const { data, error } = await supabaseClient
            .from("notes")
            .select("*")
            .eq("student_id", user.id)
            .order("created_at", {
              ascending: false,
            });

          if (error) {
            console.error(error);

            showError(
              "Unable to load notes. Check your Supabase table and policies.",
            );

            return;
          }

          allNotes = data || [];

          populateSubjectFilter();

          renderNotes(allNotes);

          updateStatistics(allNotes);

          renderRecentNotes(allNotes);

          renderSubjectProgress(allNotes);
        }

        /* =====================================================
       RENDER NOTES
    ===================================================== */

        function renderNotes(notes) {
          const grid = document.getElementById("notesGrid");

          if (!notes.length) {
            grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📚</div>
            <h3>No Notes Available</h3>
            <p>Your teacher has not uploaded any notes yet.</p>
          </div>
        `;

            return;
          }

          grid.innerHTML = notes
            .map((note) => {
              const icon = getSubjectIcon(note.subject);

              const iconClass = getSubjectClass(note.subject);

              return `
          <article class="note-card">

            <div class="note-top">

              <div class="note-icon ${iconClass}">
                ${icon}
              </div>

              <button
                class="note-menu"
                onclick="showNoteMenu('${note.id}')"
              >
                ⋮
              </button>

            </div>


            <h3 class="note-title">
              ${escapeHTML(note.title || "Untitled Note")}
            </h3>


            <p class="note-meta">
              ${escapeHTML(note.subject || "General")}
              ${note.chapter ? " • " + escapeHTML(note.chapter) : ""}
            </p>


            <div class="note-bottom">

              <span class="file-type">
                ${escapeHTML(note.file_type || "PDF")}
              </span>

              <span class="file-size">
                ${escapeHTML(note.file_size || "")}
              </span>

            </div>


            <div class="note-actions">

              <button
                class="note-btn view-btn"
                onclick="viewNote('${note.file_url || ""}')"
              >
                View
              </button>

            </div>

          </article>
        `;
            })
            .join("");
        }

        /* =====================================================
       SUBJECT FILTER
    ===================================================== */

        function populateSubjectFilter() {
          const filter = document.getElementById("subjectFilter");

          const subjects = [
            ...new Set(allNotes.map((note) => note.subject).filter(Boolean)),
          ];

          filter.innerHTML =
            `<option value="all">All Subjects</option>` +
            subjects
              .map(
                (subject) => `
          <option value="${escapeAttribute(subject)}">
            ${escapeHTML(subject)}
          </option>
        `,
              )
              .join("");
        }

        document
          .getElementById("subjectFilter")
          .addEventListener("change", applyFilters);

        document
          .getElementById("sortFilter")
          .addEventListener("change", applyFilters);

        function applyFilters() {
          const subject = document.getElementById("subjectFilter").value;

          const sort = document.getElementById("sortFilter").value;

          let filtered = [...allNotes];

          if (subject !== "all") {
            filtered = filtered.filter((note) => note.subject === subject);
          }

          if (sort === "newest") {
            filtered.sort(
              (a, b) => new Date(b.created_at) - new Date(a.created_at),
            );
          } else if (sort === "oldest") {
            filtered.sort(
              (a, b) => new Date(a.created_at) - new Date(b.created_at),
            );
          } else if (sort === "name") {
            filtered.sort((a, b) =>
              (a.title || "").localeCompare(b.title || ""),
            );
          }

          renderNotes(filtered);
        }

        /* =====================================================
       STATISTICS
    ===================================================== */

        function updateStatistics(notes) {
          document.getElementById("totalNotes").textContent = notes.length;

          const subjects = new Set(
            notes.map((note) => note.subject).filter(Boolean),
          );

          document.getElementById("subjectsCovered").textContent =
            subjects.size;

          const oneWeekAgo = new Date();

          oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);

          const recent = notes.filter(
            (note) => new Date(note.created_at) >= oneWeekAgo,
          );

          document.getElementById("recentNotes").textContent = recent.length;
        }

        /* =====================================================
       RECENT NOTES
    ===================================================== */

        function renderRecentNotes(notes) {
          const container = document.getElementById("recentNotesList");

          const recent = [...notes]
            .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
            .slice(0, 5);

          if (!recent.length) {
            container.innerHTML = `<p style="font-size:11px;color:#74819a">
             No recent notes.
           </p>`;

            return;
          }

          container.innerHTML = recent
            .map((note) => {
              const icon = getSubjectIcon(note.subject);

              const iconClass = getSubjectClass(note.subject);

              return `
            <div
              class="recent-note"
              onclick="viewNote('${note.file_url || ""}')"
              style="cursor:pointer"
            >

              <div class="recent-icon ${iconClass}">
                ${icon}
              </div>

              <div class="recent-info">

                <h4>
                  ${escapeHTML(note.title || "Untitled Note")}
                </h4>

                <p>
                  ${escapeHTML(note.subject || "General")}
                  •
                  ${formatDate(note.created_at)}
                </p>

              </div>

            </div>
          `;
            })
            .join("");
        }

        /* =====================================================
       SUBJECT PROGRESS
    ===================================================== */

        function renderSubjectProgress(notes) {
          const container = document.getElementById("subjectProgress");

          const subjectCounts = {};

          notes.forEach((note) => {
            const subject = note.subject || "Other";

            subjectCounts[subject] = (subjectCounts[subject] || 0) + 1;
          });

          const entries = Object.entries(subjectCounts).sort(
            (a, b) => b[1] - a[1],
          );

          if (!entries.length) {
            container.innerHTML = `<p style="font-size:11px;color:#74819a">
             No subject data available.
           </p>`;

            return;
          }

          const max = Math.max(...entries.map((item) => item[1]));

          container.innerHTML = entries
            .slice(0, 6)
            .map(([subject, count]) => {
              const percentage = Math.round((count / max) * 100);

              return `
              <div class="subject-progress">

                <div class="subject-row">
                  <span>
                    ${escapeHTML(subject)}
                  </span>

                  <span>
                    ${count}
                  </span>
                </div>

                <div class="progress-track">
                  <div
                    class="progress-bar"
                    style="
                      width:${percentage}%;
                      background:#5b35df;
                    "
                  ></div>
                </div>

              </div>
            `;
            })
            .join("");
        }

        /* =====================================================
       VIEW NOTE
    ===================================================== */

        function viewNote(url) {
          if (!url) {
            alert("This note does not have a file attached.");

            return;
          }

          window.open(url, "_blank", "noopener,noreferrer");
        }

        /* =====================================================
       NOTE MENU
    ===================================================== */

        function showNoteMenu(id) {
          const note = allNotes.find((item) => item.id === id);

          if (!note) return;

          alert(
            `${note.title || "Note"}\n\nSubject: ${note.subject || "General"}`,
          );
        }

        /* =====================================================
       SUBJECT ICONS
    ===================================================== */

        function getSubjectIcon(subject) {
          if (!subject) return "📄";

          const value = subject.toLowerCase();

          if (value.includes("physics")) return "⚛";

          if (value.includes("chemistry")) return "⚗";

          if (value.includes("math") || value.includes("statistics"))
            return "Σ";

          if (value.includes("english")) return "📖";

          if (value.includes("computer") || value.includes("program"))
            return "</>";

          if (value.includes("biology")) return "🧬";

          if (value.includes("history") || value.includes("social"))
            return "🌐";

          return "📄";
        }

        function getSubjectClass(subject) {
          if (!subject) return "purple";

          const value = subject.toLowerCase();

          if (value.includes("physics")) return "purple";

          if (value.includes("chemistry")) return "green";

          if (value.includes("math") || value.includes("statistics"))
            return "orange";

          if (value.includes("english")) return "blue";

          if (value.includes("computer") || value.includes("program"))
            return "purple";

          return "blue";
        }

        /* =====================================================
       DATE FORMAT
    ===================================================== */

        function formatDate(date) {
          if (!date) return "";

          return new Date(date).toLocaleDateString("en-IN", {
            day: "numeric",
            month: "short",
          });
        }

        /* =====================================================
       SECURITY HELPERS
    ===================================================== */

        function escapeHTML(value) {
          return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }

        function escapeAttribute(value) {
          return String(value).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
        }

        /* =====================================================
       ERROR
    ===================================================== */

        function showError(message) {
          document.getElementById("notesGrid").innerHTML = `
          <div class="empty-state">

            <div class="empty-icon">
              ⚠️
            </div>

            <h3>
              Something went wrong
            </h3>

            <p>
              ${escapeHTML(message)}
            </p>

          </div>
        `;
        }

        /* =====================================================
       INITIALIZE
    ===================================================== */

        document.addEventListener("DOMContentLoaded", loadNotes);
      }
    </script>
