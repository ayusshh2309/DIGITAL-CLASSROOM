<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Videos - Smart Learning DC</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      /* =====================================================
           RESET
        ===================================================== */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        background: #f5f9fd;
        color: #07183f;
      }

      button,
      input,
      select {
        font-family: inherit;
      }

      button {
        cursor: pointer;
      }

      /* =====================================================
           MAIN PAGE
        ===================================================== */

      .page {
        min-height: 100vh;

        padding: 45px 48px 40px;

        background:
          radial-gradient(
            circle at top left,
            rgba(84, 55, 237, 0.055),
            transparent 32%
          ),
          #f5f9fd;
      }

      /* =====================================================
           PAGE HEADER
        ===================================================== */

      .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 4px 4px 8px;
        gap: 20px;

        margin-bottom: 18px;
      }

      .page-title {
        display: flex;
        align-items: flex-start;
      }

      .page-title h1 {
        margin-top: 7px;
        font-size: clamp(2rem, 3vw, 2.7rem);
        font-weight: 800;
        color: #08183e;
        letter-spacing: -0.8px;
      }

      .page-eyebrow {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #008b95;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .page-eyebrow i {
        font-size: 13px;
      }

      .page-title p {
        max-width: 540px;
        margin-top: 4px;
        color: #53698e;
        font-size: 1.05rem;
      }

      .registration-context {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        width: fit-content;
        margin-top: 18px;
        padding: 8px 12px;
        border: 1px solid rgba(41, 174, 184, 0.22);
        border-radius: 10px;
        background: rgba(237, 250, 250, 0.72);
        color: #315360;
      }

      .scope-label {
        color: #087f8a;
        font-weight: 800;
      }

      .scope-value {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }

      .scope-value i {
        color: #008b95;
        font-size: 15px;
      }

      .page-eyebrow {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #008b95;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .page-eyebrow i {
        font-size: 13px;
      }

      /* =====================================================
           SEARCH
        ===================================================== */

      .search-box {
        width: 405px;

        height: 48px;

        background: white;

        border: 1px solid #dce5ef;

        border-radius: 13px;

        display: flex;
        align-items: center;

        padding: 0 16px;

        box-shadow: 0 4px 14px rgba(20, 45, 80, 0.025);
      }

      .search-box i {
        color: #607493;

        font-size: 17px;

        margin-right: 13px;
      }

      .search-box input {
        width: 100%;

        border: none;

        outline: none;

        background: transparent;

        color: #172d53;

        font-size: 13px;
      }

      .search-box input::placeholder {
        color: #7083a2;
      }

      /* =====================================================
           SUBJECT TABS
        ===================================================== */

      .subject-tabs {
        display: flex;

        align-items: center;

        gap: 12px;

        overflow-x: auto;

        padding-bottom: 4px;

        margin-bottom: 32px;

        scrollbar-width: none;
      }

      .subject-tabs::-webkit-scrollbar {
        display: none;
      }

      .subject-tab {
        flex-shrink: 0;

        height: 40px;

        padding: 0 18px;

        border-radius: 21px;

        border: 1px solid #dce5ef;

        background: white;

        color: #243b66;

        font-size: 13px;

        font-weight: 600;

        display: flex;
        align-items: center;

        gap: 9px;

        transition: 0.2s;
      }

      .subject-tab[hidden] {
        display: none;
      }

      .subject-tab:hover {
        border-color: #6947ee;

        color: #5636df;
      }

      .subject-tab.active {
        background: linear-gradient(135deg, #633bf0, #5130dc);

        border-color: transparent;

        color: white;

        box-shadow: 0 6px 15px rgba(88, 51, 225, 0.2);
      }

      .tab-dot {
        width: 10px;
        height: 10px;

        border-radius: 50%;

        background: #5d3aeb;
      }

      .tab-dot.green {
        background: #08ae79;
      }

      .tab-dot.orange {
        background: #ff8f00;
      }

      .tab-dot.blue {
        background: #2679ed;
      }

      .tab-dot.pink {
        background: #db3785;
      }

      .tab-dot.teal {
        background: #0ba4a5;
      }

      .tab-dot.yellow {
        background: #ffb000;
      }

      /* =====================================================
           CONTENT LAYOUT
        ===================================================== */

      .content-layout {
        display: grid;

        grid-template-columns: 265px minmax(0, 1fr);

        gap: 21px;

        align-items: start;
      }

      /* =====================================================
           FILTER PANEL
        ===================================================== */

      .filter-card {
        background: white;

        border: 1px solid #e6edf4;

        border-radius: 15px;

        padding: 22px 18px;

        box-shadow: 0 8px 25px rgba(24, 45, 78, 0.04);
      }

      .filter-title {
        display: flex;

        align-items: center;

        gap: 11px;

        font-size: 16px;

        font-weight: 700;

        color: #172d53;

        margin-bottom: 23px;
      }

      .filter-title i {
        color: #304f82;
      }

      .filter-group {
        margin-bottom: 24px;
      }

      .filter-group label {
        display: block;

        font-size: 13px;

        font-weight: 600;

        color: #19335f;

        margin-bottom: 9px;
      }

      .select-wrapper {
        position: relative;
      }

      .select-wrapper i {
        position: absolute;

        right: 14px;

        top: 50%;

        transform: translateY(-50%);

        pointer-events: none;

        color: #607493;

        font-size: 12px;
      }

      select {
        width: 100%;

        height: 41px;

        padding: 0 35px 0 13px;

        appearance: none;

        border: 1px solid #d9e4ef;

        border-radius: 9px;

        outline: none;

        background: white;

        color: #29436d;

        font-size: 12px;

        cursor: pointer;
      }

      select:focus {
        border-color: #6847e9;
      }

      .filter-divider {
        height: 1px;

        background: #e4ebf2;

        margin: 28px 0;
      }

      /* =====================================================
           TOTAL VIDEOS
        ===================================================== */

      .total-box {
        display: flex;

        flex-direction: column;
      }

      .total-heading {
        display: flex;

        align-items: center;

        gap: 12px;

        margin-bottom: 17px;
      }

      .total-icon {
        width: 37px;
        height: 37px;

        border-radius: 9px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: linear-gradient(135deg, #6940ef, #512cd9);

        color: white;

        font-size: 15px;
      }

      .total-heading span {
        font-size: 12px;

        color: #40577c;

        font-weight: 600;
      }

      .total-number {
        font-size: 25px;

        font-weight: 800;

        color: #07183f;

        margin-top: 1px;
      }

      .total-progress {
        height: 6px;

        border-radius: 20px;

        background: #e7edf4;

        overflow: hidden;

        margin-bottom: 13px;
      }

      .total-progress-fill {
        height: 100%;

        width: 67%;

        background: #5e3beb;

        border-radius: 20px;
      }

      .total-description {
        color: #637898;

        font-size: 11px;
      }

      /* =====================================================
           VIDEO AREA
        ===================================================== */

      .video-area {
        min-width: 0;
      }

      .video-grid {
        display: grid;

        grid-template-columns: repeat(3, minmax(0, 1fr));

        gap: 17px;
      }

      /* =====================================================
           VIDEO CARD
        ===================================================== */

      .video-card {
        background: white;

        border: 1px solid #e6edf4;

        border-radius: 14px;

        padding: 16px;

        box-shadow: 0 8px 22px rgba(24, 45, 78, 0.035);

        transition:
          transform 0.22s ease,
          box-shadow 0.22s ease;
      }

      .video-card:hover {
        transform: translateY(-3px);

        box-shadow: 0 14px 32px rgba(24, 45, 78, 0.08);
      }

      /* =====================================================
           THUMBNAIL
        ===================================================== */

      .thumbnail {
        height: 125px;

        border-radius: 10px;

        position: relative;

        overflow: hidden;

        display: flex;

        align-items: center;

        justify-content: center;

        margin-bottom: 10px;

        background: #182c50;
      }

      .thumbnail img {
        width: 100%;
        height: 100%;

        object-fit: cover;

        display: block;
      }

      .thumbnail::after {
        content: "";

        position: absolute;

        inset: 0;

        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.25),
          transparent 55%
        );
      }

      .play-button {
        position: absolute;

        z-index: 2;

        width: 43px;
        height: 43px;

        border-radius: 50%;

        border: 1px solid rgba(255, 255, 255, 0.75);

        background: rgba(15, 25, 35, 0.67);

        color: white;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 15px;

        padding-left: 2px;

        transition: 0.2s;
      }

      .play-button:hover {
        transform: scale(1.08);

        background: rgba(86, 51, 224, 0.85);
      }

      .duration {
        position: absolute;

        z-index: 3;

        bottom: 7px;

        right: 7px;

        background: rgba(8, 18, 34, 0.82);

        color: white;

        padding: 4px 6px;

        border-radius: 4px;

        font-size: 9px;

        font-weight: 600;
      }

      /* =====================================================
           CARD MENU
        ===================================================== */

      .card-menu {
        position: absolute;

        top: 9px;

        right: 9px;

        z-index: 5;
      }

      .card-menu-button {
        width: 27px;
        height: 27px;

        border: none;

        border-radius: 6px;

        background: rgba(255, 255, 255, 0.8);

        color: #173661;

        font-size: 13px;

        backdrop-filter: blur(4px);
      }

      .card-menu-button:hover {
        background: white;
      }

      .card-dropdown {
        position: absolute;

        right: 0;

        top: 31px;

        width: 125px;

        background: white;

        border: 1px solid #e3e9f0;

        border-radius: 8px;

        box-shadow: 0 12px 30px rgba(20, 40, 70, 0.13);

        padding: 5px;

        display: none;
      }

      .card-dropdown.show {
        display: block;
      }

      .card-dropdown button {
        width: 100%;

        border: none;

        background: transparent;

        text-align: left;

        padding: 8px;

        border-radius: 5px;

        font-size: 11px;

        color: #243a60;
      }

      .card-dropdown button:hover {
        background: #f3f6fa;
      }

      /* =====================================================
           VIDEO INFORMATION
        ===================================================== */

      .video-subject {
        display: inline-flex;

        align-items: center;

        padding: 4px 9px;

        border-radius: 20px;

        font-size: 9px;

        font-weight: 700;

        margin-bottom: 7px;

        border: 1px solid transparent;
      }

      .subject-purple {
        color: #5733dc;
        background: #f0edff;
        border-color: #dcd4ff;
      }

      .subject-green {
        color: #008e68;
        background: #e8fbf4;
        border-color: #bceedd;
      }

      .subject-orange {
        color: #e87500;
        background: #fff2df;
        border-color: #ffdba9;
      }

      .subject-blue {
        color: #176fd8;
        background: #e9f3ff;
        border-color: #cbe2ff;
      }

      .subject-pink {
        color: #cf2879;
        background: #ffebf4;
        border-color: #f8c7de;
      }

      .subject-teal {
        color: #078e91;
        background: #e8f8f7;
        border-color: #c4ebea;
      }

      .subject-yellow {
        color: #d89100;
        background: #fff7dc;
        border-color: #f7e1a2;
      }

      .video-title {
        font-size: 14px;

        font-weight: 700;

        color: #102650;

        margin-bottom: 6px;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;
      }

      .video-description {
        color: #62799c;

        font-size: 11px;

        line-height: 1.55;

        min-height: 34px;

        margin-bottom: 12px;
      }

      /* =====================================================
           VIDEO FOOTER
        ===================================================== */

      .video-footer {
        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 10px;
      }

      .video-meta {
        display: flex;

        align-items: center;

        gap: 14px;

        color: #536b91;

        font-size: 10px;
      }

      .meta-item {
        display: flex;

        align-items: center;

        gap: 5px;
      }

      .meta-item i {
        font-size: 10px;
      }

      .watch-button {
        border: none;

        border-radius: 9px;

        padding: 9px 17px;

        background: #efecff;

        color: #5736e7;

        font-size: 11px;

        font-weight: 700;

        display: flex;

        align-items: center;

        gap: 7px;

        transition: 0.2s;
      }

      .watch-button:hover {
        transform: translateY(-1px);

        filter: brightness(0.97);
      }

      .watch-green {
        background: #e8faf3;
        color: #00a977;
      }

      .watch-orange {
        background: #fff2df;
        color: #e98300;
      }

      .watch-blue {
        background: #eaf3ff;
        color: #176fdb;
      }

      .watch-pink {
        background: #ffedf6;
        color: #d42d7c;
      }

      .watch-teal {
        background: #e8f8f7;
        color: #049b9d;
      }

      .watch-yellow {
        background: #fff7df;
        color: #e89a00;
      }

      /* =====================================================
           NO RESULTS
        ===================================================== */

      .no-results {
        display: none;

        grid-column: 1 / -1;

        padding: 70px 20px;

        text-align: center;

        background: white;

        border: 1px solid #e6edf4;

        border-radius: 15px;
      }

      .no-results i {
        font-size: 40px;

        color: #7253e8;

        margin-bottom: 14px;
      }

      .no-results h3 {
        font-size: 18px;

        margin-bottom: 7px;
      }

      .no-results p {
        color: #72839f;

        font-size: 12px;
      }

      .videos-status {
        margin-bottom: 14px;
        color: #53698e;
        font-size: 13px;
      }

      .videos-status[data-state="error"] {
        color: #b42318;
      }

      .videos-status button {
        margin-left: 8px;
        padding: 5px 10px;
        border: 1px solid #d9e4ef;
        border-radius: 7px;
        background: white;
        color: #29436d;
        font: inherit;
        cursor: pointer;
      }

      /* =====================================================
           VIDEO MODAL
        ===================================================== */

      .modal-overlay {
        position: fixed;

        inset: 0;

        background: rgba(4, 15, 35, 0.62);

        backdrop-filter: blur(5px);

        display: none;

        align-items: center;
        justify-content: center;

        padding: 20px;

        z-index: 100;
      }

      .modal-overlay.show {
        display: flex;
      }

      .video-modal {
        width: 100%;

        max-width: 850px;

        background: #101b31;

        border-radius: 16px;

        overflow: hidden;

        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      }

      .modal-video-area {
        height: 470px;

        background: #071020;

        position: relative;

        display: flex;

        align-items: center;

        justify-content: center;
      }

      .modal-video-area img {
        width: 100%;
        height: 100%;

        object-fit: cover;

        opacity: 0.72;
      }

      .modal-video-area video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }

      .video-player-status {
        position: absolute;
        z-index: 4;
        right: 16px;
        bottom: 14px;
        left: 16px;
        color: #fff;
        font-size: 12px;
        text-align: center;
        text-shadow: 0 1px 4px #000;
      }

      .video-player-status[data-state="error"] {
        color: #ffd1d1;
      }

      .modal-play {
        position: absolute;
        z-index: 3;

        width: 75px;
        height: 75px;

        border-radius: 50%;

        border: none;

        background: #603be7;

        color: white;

        font-size: 25px;

        padding-left: 4px;

        box-shadow: 0 10px 30px rgba(75, 43, 204, 0.4);
      }

      .modal-close {
        position: absolute;

        top: 15px;
        right: 15px;

        width: 35px;
        height: 35px;

        border: none;

        border-radius: 50%;

        background: rgba(0, 0, 0, 0.55);

        color: white;

        z-index: 5;
      }

      .modal-content {
        padding: 22px 25px;
      }

      .modal-content h2 {
        color: white;

        font-size: 20px;

        margin-bottom: 7px;
      }

      .modal-content p {
        color: #aebbd0;

        font-size: 12px;
      }

      /* =====================================================
           RESPONSIVE
        ===================================================== */

      @media (max-width: 1250px) {
        .video-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 950px) {
        .page {
          padding: 28px 25px;
        }

        .page-header {
          align-items: flex-start;

          flex-direction: column;
        }

        .search-box {
          width: 100%;
        }

        .content-layout {
          grid-template-columns: 1fr;
        }

        .filter-card {
          display: grid;

          grid-template-columns: repeat(3, 1fr);

          gap: 18px;
        }

        .filter-title {
          grid-column: 1 / -1;

          margin-bottom: 0;
        }

        .filter-divider {
          display: none;
        }

        .total-box {
          align-self: end;
        }
      }

      @media (max-width: 650px) {
        .page {
          padding: 22px 15px;
        }

        .page-title {
          align-items: flex-start;
        }

        .page-title h1 {
          font-size: 27px;
        }

        .video-grid {
          grid-template-columns: 1fr;
        }

        .filter-card {
          display: block;
        }

        .filter-title {
          margin-bottom: 20px;
        }

        .total-box {
          margin-top: 25px;
        }

        .modal-video-area {
          height: 250px;
        }

        .video-footer {
          align-items: flex-end;
        }
      }
    </style>
    <link rel="stylesheet" href="../css/student-layout.css" />
  </head>

  <body>
    <div id="studentLayout"></div>
    <div class="page">
      <!-- =================================================
         HEADER
    ================================================== -->

      <header class="page-header">
        <div class="page-title">
          <div>
            <div class="page-eyebrow">
              <i class="fa-solid fa-book-open" aria-hidden="true"></i>
              Student workspace
            </div>

            <h1>Videos</h1>

            <p>Watch and learn from your subject-wise video lessons.</p>

            <div class="registration-context" id="registrationContext" hidden>
              <span class="scope-label">Your registered curriculum</span>
              <span class="scope-value">
                <i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>
                <span id="registrationContextText"></span>
              </span>
            </div>
          </div>
        </div>

        <!-- SEARCH -->

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>

          <input type="text" id="searchInput" placeholder="Search videos..." />
        </div>
      </header>

      <!-- =================================================
         SUBJECT TABS
    ================================================== -->

      <div class="subject-tabs" id="subjectTabs">
        <button class="subject-tab active" data-subject="All">
          All Subjects
        </button>
      </div>

      <!-- =================================================
         CONTENT
    ================================================== -->

      <div class="content-layout">
        <!-- =================================================
             FILTER PANEL
        ================================================== -->

        <aside class="filter-card">
          <div class="filter-title">
            <i class="fa-solid fa-sliders"></i>

            Filter
          </div>

          <!-- SUBJECT -->

          <div class="filter-group">
            <label> Subject </label>

            <div class="select-wrapper">
              <select id="subjectFilter">
                <option value="All">All Subjects</option>
              </select>

              <i class="fa-solid fa-chevron-down"></i>
            </div>
          </div>

          <!-- SORT -->

          <div class="filter-group">
            <label> Sort By </label>

            <div class="select-wrapper">
              <select id="sortFilter">
                <option value="latest">Latest First</option>

                <option value="oldest">Oldest First</option>

                <option value="az">A - Z</option>

              </select>

              <i class="fa-solid fa-chevron-down"></i>
            </div>
          </div>

          <div class="filter-divider"></div>

          <!-- TOTAL -->

          <div class="total-box">
            <div class="total-heading">
              <div class="total-icon">
                <i class="fa-solid fa-play"></i>
              </div>

              <div>
                <span> Total Videos </span>

                <div class="total-number" id="totalVideos">0</div>
              </div>
            </div>

            <div class="total-progress">
              <div class="total-progress-fill" id="totalProgress"></div>
            </div>

            <p class="total-description">Across all subjects</p>
          </div>
        </aside>

        <!-- =================================================
             VIDEO AREA
        ================================================== -->

        <main class="video-area">
          <div class="videos-status" id="videosStatus" role="status" aria-live="polite" hidden></div>
          <div class="video-grid" id="videoGrid">
            <!-- Cards generated by JavaScript -->

            <div class="no-results" id="noResults">
              <i class="fa-solid fa-video-slash"></i>

              <h3>No videos found</h3>

              <p>Try another search or subject.</p>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- =====================================================
     VIDEO MODAL
===================================================== -->

    <div class="modal-overlay" id="videoModal">
      <div class="video-modal">
        <div class="modal-video-area">
          <img id="modalThumbnail" src="" alt="" hidden />
          <video id="videoPlayer" controls playsinline preload="metadata" hidden></video>
          <p class="video-player-status" id="videoPlayerStatus" role="status" aria-live="polite" hidden></p>

          <button class="modal-play" id="modalPlay">
            <i class="fa-solid fa-play"></i>
          </button>

          <button class="modal-close" id="closeVideoModal" type="button" aria-label="Close video">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="modal-content">
          <h2 id="modalTitle">Video Title</h2>

          <p id="modalDescription"></p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/subject-service.js"></script>
    <script src="../js/student-curriculum.js"></script>
    <script src="../js/student-videos.js"></script>
    <script src="../js/student-layout.js"></script>
  </body>
</html>
